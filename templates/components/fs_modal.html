<!-- File System Explorer Modal -->
<div id="fs-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden modal-overlay p-4">
    <div class="bg-white rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl border border-[#E5DCD0] flex flex-col max-h-[85vh] animate-in fade-in zoom-in-95 duration-200">
        <!-- Modal Header -->
        <div class="bg-[#FDF9F3] border-b border-[#E5DCD0] px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-[#E95722]/10 flex items-center justify-center text-[#E95722]">
                    <i data-lucide="folder-search" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 id="fs-modal-title" class="text-lg font-bold text-[#111111] font-headline">Select Folder</h3>
                    <p id="fs-modal-subtitle" class="text-xs text-[#777777]">Browse your PC or pick a quick location</p>
                </div>
            </div>
            <button type="button" onclick="window.fsExplorer.close()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-[#E5DCD0] text-[#777777] transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Quick Locations & Drives -->
        <div class="px-6 py-3 bg-[#FAF4ED] border-b border-[#E5DCD0] flex flex-wrap gap-2 items-center text-xs">
            <span class="text-[#777777] font-semibold mr-1">Quick:</span>
            <div id="fs-quick-locations" class="flex flex-wrap gap-1.5">
                <!-- Dynamically populated -->
            </div>
            <div class="h-4 w-[1px] bg-[#E5DCD0] mx-1"></div>
            <div id="fs-drives" class="flex gap-1.5">
                <!-- Dynamically populated drives -->
            </div>
        </div>

        <!-- Breadcrumbs & Path Bar -->
        <div class="px-6 py-3 border-b border-[#E5DCD0] flex items-center gap-2 bg-white">
            <button type="button" id="fs-up-btn" onclick="window.fsExplorer.goUp()" title="Go up one folder" class="p-2 rounded-xl border border-[#E5DCD0] hover:bg-[#F7EBDD] text-[#111111] transition disabled:opacity-40">
                <i data-lucide="arrow-up" class="w-4 h-4"></i>
            </button>
            <div id="fs-breadcrumbs" class="flex-1 flex items-center gap-1.5 overflow-x-auto text-xs font-medium text-[#111111] whitespace-nowrap py-1">
                <!-- Breadcrumbs rendered here -->
            </div>
            <button type="button" onclick="window.fsExplorer.refresh()" title="Refresh" class="p-2 rounded-xl text-[#777777] hover:bg-[#FAF4ED] transition">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Files & Folders List -->
        <div id="fs-items-container" class="flex-1 overflow-y-auto p-4 space-y-1 min-h-[250px] max-h-[400px]">
            <div class="flex items-center justify-center h-48 text-[#777777] text-sm gap-2">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-[#E95722]"></i> Loading folder contents...
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="bg-[#FDF9F3] border-t border-[#E5DCD0] px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <!-- Native OS Dialog Button -->
            <button type="button" id="fs-native-dialog-btn" onclick="window.fsExplorer.openNativeDialog()" class="text-xs text-[#777777] hover:text-[#E95722] flex items-center gap-1.5 transition">
                <i data-lucide="external-link" class="w-4 h-4"></i>
                <span>Open in Windows Dialog</span>
                <span id="fs-native-spinner" class="hidden"><i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i></span>
            </button>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button type="button" onclick="window.fsExplorer.close()" class="px-4 py-2 rounded-full border border-[#E5DCD0] text-xs font-semibold text-[#777777] hover:bg-[#E5DCD0] transition">
                    Cancel
                </button>
                <button type="button" id="fs-confirm-selection-btn" onclick="window.fsExplorer.confirmSelection()" class="btn-solo-primary px-5 py-2 rounded-full text-xs font-bold flex items-center gap-1.5">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span id="fs-confirm-btn-text">Select This Folder</span>
                </button>
            </div>
        </div>
    </div>
</div>
